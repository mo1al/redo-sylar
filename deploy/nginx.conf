# ============================================================
# 博客 nginx 反向代理 + 安全加固
#
# 部署方式（二选一）：
#   1) 放到 /etc/nginx/conf.d/blog.conf  （推荐，会自动 include 进 http{}，
#      下面的 limit_req_zone / limit_conn_zone 才能生效）
#   2) 放到 /etc/nginx/sites-available/blog 并软链到 sites-enabled，
#      但需要把 limit_req_zone / limit_conn_zone 两行挪到
#      /etc/nginx/nginx.conf 的 http {} 块里。
#
# 生效：
#   sudo nginx -t && sudo systemctl reload nginx
# ============================================================

# ---- 单 IP 限流：每秒 10 次请求，突发 20（防 CC / 爬虫） ----
limit_req_zone  $binary_remote_addr zone=blog_req:10m  rate=10r/s;
# ---- 单 IP 并发连接数限制 ----
limit_conn_zone $binary_remote_addr zone=blog_conn:10m;

server {
    listen 80;
    server_name example.com;                 # 改成你的域名或公网 IP

    server_tokens off;                       # 隐藏 nginx 版本号，避免信息泄露
    client_max_body_size 1m;                 # 限制请求体大小（博客无需大 body）

    # ---- 安全响应头 ----
    add_header X-Frame-Options "SAMEORIGIN" always;                      # 防点击劫持
    add_header X-Content-Type-Options "nosniff" always;                  # 防 MIME 嗅探
    add_header X-XSS-Protection "1; mode=block" always;                  # 防反射型 XSS
    add_header Referrer-Policy "strict-origin-when-cross-origin" always; # 限制 Referrer 泄露

    # ---- 屏蔽隐藏文件（保留 .well-known 给 certbot 做 HTTPS 验证）----
    location ~ /\.(?!well-known) {
        deny all;
    }
    # ---- 屏蔽敏感/备份/临时文件 ----
    location ~* \.(git|env|bak|sql|conf|log|sh|swp|old)$ {
        deny all;
    }

    location / {
        # 只允许 GET / HEAD / POST，其余方法拒绝
        limit_except GET HEAD POST {
            deny all;
        }

        # 限流 + 限并发
        limit_req  zone=blog_req burst=20 nodelay;
        limit_conn blog_conn 20;

        # 反向代理到后端 C++ 服务
        proxy_pass http://127.0.0.1:8020;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }
}
